#####################################################################
#   Nevermore chamber filter / air circulator
#####################################################################
# The Nevermore (FAN on PD12) and the chamber thermistor (PF4) are set up as a
# temperature_fan so Mainsail shows chamber temperature and filter speed
# together, like the MCU fan.
#
# Klipper does NOT regulate this fan by chamber temperature. The _NEVERMORE_TICK
# loop below sets its speed from the bed heater instead. The target Mainsail
# shows is a placeholder: 1C = running (at the loop's chosen speed), 0 = off.
#
# Why: running the Nevermore hard while the bed heats pulls heat off the bed
# faster than it can climb, and verify_heater halts the printer. Once the bed
# is at temperature its heater has plenty of headroom, so the fan can ramp up.
#
# Behaviour (thresholds in _NEVERMORE_VARS):
#   bed target < 90C    off - PLA/PETG don't need filtering, saves the carbon
#   bed target >= 90C
#     heat-up           off until the bed is within 3C of target, so all bed
#                       power goes into heating
#     at target         every 30s: step up 10% while the bed holds within 1C and
#                       its heater is below 75% of max_power; step down 10% if
#                       the bed sags or its heater goes above 90% of max_power
#   bed off after a
#   hot print           scrub at 100% until the bed cools below 45C
#
# Console messages are prefixed "Nevermore:"; problems are reported as errors (!!).
#
# Commands:
#   NEVERMORE_STATUS                 show what the loop is doing and why
#   NEVERMORE_SET SPEED=<0-1>        take manual control at a fixed speed (turns auto off)
#   NEVERMORE_AUTO ENABLE=<0|1>      turn the automatic loop off / back on
#
# Note: Klipper can't run the background loop while a long command (G4, M109,
# M190, TEMPERATURE_WAIT) is in progress. Use _NEVERMORE_DWELL SECONDS=<n>
# instead of G4 for long waits such as heat soak so the fan keeps adjusting.

[temperature_fan nevermore]
pin: PD12
kick_start_time: 0.5
# Klipper defaults these to 1.0 and 0.3; 0.3 would silently raise low speeds
shutdown_speed: 0.0
min_speed: 0.0
max_speed: 1.0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF4
# Klipper shuts down if the chamber reading leaves this range
min_temp: 0
max_temp: 80
control: watermark
target_temp: 0

[gcode_macro _NEVERMORE_VARS]
variable_bed_threshold: 90      # run for bed targets at/above this (C)
variable_scrub_below: 45        # after a hot print, scrub until the bed is below this (C)
variable_scrub_speed: 1.0
variable_max_speed: 1.0
variable_step: 0.1              # speed change per adjustment
variable_adjust_every: 30       # seconds between speed adjustments
variable_heatup_margin: 3       # held off until the bed is within this of target (C)
variable_hold_margin: 1         # bed must be within this of target to step up (C)
variable_up_below: 0.75         # step up while bed heater < this fraction of max_power
variable_down_above: 0.90       # step down when bed heater > this fraction of max_power
variable_up_holdoff: 120        # after a step down, wait this long before stepping up (s)
variable_chamber_warn: 70       # warn when the chamber reaches this (C)
gcode:

# Loop state - written by _NEVERMORE_TICK, don't edit
[gcode_macro _NEVERMORE_STATE]
variable_enabled: True
variable_mode: 'off'
variable_speed: 0.0
variable_reached: False
variable_last_target: 0.0
variable_power_avg: 0.0
variable_tick: 0
variable_holdoff_until: 0
variable_hot_session: False
variable_warned_sag: False
variable_warned_chamber: False
gcode:

[delayed_gcode _nevermore_loop]
initial_duration: 5
gcode:
    # Reschedule first so an error in the tick can't stop the loop
    UPDATE_DELAYED_GCODE ID=_nevermore_loop DURATION=5
    _NEVERMORE_TICK

[gcode_macro _NEVERMORE_TICK]
description: One step of the Nevermore control loop (runs every 5s)
gcode:
    {% set v = printer["gcode_macro _NEVERMORE_VARS"] %}
    {% set s = printer["gcode_macro _NEVERMORE_STATE"] %}
    {% set tf = printer["temperature_fan nevermore"] %}
    {% set bed = printer.heater_bed %}
    {% set max_power = printer.configfile.settings.heater_bed.max_power|float %}
    {% set target = bed.target|float %}
    {% set temp = bed.temperature|float %}
    {% set tick = s.tick + 1 %}
    {% set ticks_per_adjust = [(v.adjust_every / 5)|int, 1]|max %}
    {% set adjust_now = tick % ticks_per_adjust == 0 %}

    # Bed heater power smoothed over ~30s (PID output swings a lot second to second)
    # Seeded from the live value on the first tick after a restart
    {% set prev_power = s.power_avg if s.tick > 0 else bed.power|float %}
    {% set power_avg = prev_power + (bed.power|float - prev_power) * 0.15 %}
    {% set rel_power = power_avg / max_power %}
    {% set bed_info = "bed %.1f/%.0fC, heater %d%% of max_power" % (temp, target, rel_power * 100) %}

    {% set target_changed = (target - s.last_target)|abs > 0.1 %}
    {% set reached = False if target_changed else s.reached %}
    {% set mode = s.mode %}
    {% set speed = s.speed %}
    {% set hot = s.hot_session %}
    {% set holdoff_until = s.holdoff_until %}
    {% set warned_sag = s.warned_sag %}
    {% set warned_chamber = s.warned_chamber %}
    {% set info = [] %}
    {% set errors = [] %}

    {% if not s.enabled %}
        {% set mode = 'manual' %}

    {% elif target >= v.bed_threshold %}
        {% set hot = True %}
        {% if not reached and temp >= target - v.heatup_margin %}
            {% set reached = True %}
            {% set warned_sag = False %}
            {% set mode = 'ramp' %}
            {% set _ = info.append("bed within %dC of %.0fC target - ramping up %d%% every %ds while the bed heater has headroom" % (v.heatup_margin, target, v.step * 100, v.adjust_every)) %}
        {% endif %}

        {% if not reached %}
            {% if mode != 'heatup' %}
                {% set _ = info.append("bed heating to %.0fC - holding off until it is within %dC so the bed gets full power" % (target, v.heatup_margin)) %}
            {% endif %}
            {% set mode = 'heatup' %}
            {% set speed = 0.0 %}

        {% elif temp < target - v.heatup_margin %}
            # Was at target, now well below it
            {% if speed > 0 or not warned_sag %}
                {% set _ = errors.append("bed dropped to %.1fC (target %.0fC) - stopping the Nevermore. If this repeats with the fan off, check the door, heater and SSR" % (temp, target)) %}
            {% endif %}
            {% set warned_sag = True %}
            {% set mode = 'ramp' %}
            {% set speed = 0.0 %}
            {% set holdoff_until = tick + (v.up_holdoff / 5)|int %}

        {% elif adjust_now %}
            {% set mode = 'ramp' %}
            {% set sagging = temp < target - v.hold_margin %}
            {% if sagging or rel_power > v.down_above %}
                {% if speed > 0 %}
                    {% set new_speed = [speed - v.step, 0.0]|max|round(2) %}
                    {% set _ = info.append("speed %d%% -> %d%% (%s)" % (speed * 100, new_speed * 100, bed_info)) %}
                    {% set speed = new_speed %}
                    {% set holdoff_until = tick + (v.up_holdoff / 5)|int %}
                {% elif sagging and not warned_sag %}
                    {% set _ = errors.append("bed can't hold %.0fC even with the Nevermore off (%s) - check the door, heater and SSR" % (target, bed_info)) %}
                    {% set warned_sag = True %}
                {% endif %}
            {% elif rel_power < v.up_below and tick >= holdoff_until and speed < v.max_speed %}
                {% set new_speed = [speed + v.step, v.max_speed]|min|round(2) %}
                {% set _ = info.append("speed %d%% -> %d%% (%s)" % (speed * 100, new_speed * 100, bed_info)) %}
                {% if new_speed >= v.max_speed %}
                    {% set _ = info.append("at full speed - the bed is keeping up") %}
                {% endif %}
                {% set speed = new_speed %}
                {% set warned_sag = False %}
            {% endif %}
        {% endif %}

    {% elif target > 0 %}
        {% if mode != 'low_temp' %}
            {% set _ = info.append("bed target %.0fC is below %dC - Nevermore off for this print" % (target, v.bed_threshold)) %}
        {% endif %}
        {% set mode = 'low_temp' %}
        {% set speed = 0.0 %}
        {% set hot = False %}

    {% else %}
        {% if hot and temp >= v.scrub_below %}
            {% if mode != 'scrub' %}
                {% set _ = info.append("bed off after a hot print - scrubbing at %d%% until the bed is below %dC" % (v.scrub_speed * 100, v.scrub_below)) %}
            {% endif %}
            {% set mode = 'scrub' %}
            {% set speed = v.scrub_speed %}
        {% else %}
            {% if mode == 'scrub' %}
                {% set _ = info.append("bed below %dC - scrub complete, Nevermore off" % v.scrub_below) %}
            {% endif %}
            {% set mode = 'off' %}
            {% set speed = 0.0 %}
            {% set hot = False %}
        {% endif %}
    {% endif %}

    {% if tf.temperature >= v.chamber_warn and not warned_chamber %}
        {% set _ = errors.append("chamber at %.1fC - Klipper shuts down at 80C (temperature_fan max_temp)" % tf.temperature) %}
        {% set warned_chamber = True %}
    {% elif tf.temperature < v.chamber_warn - 5 %}
        {% set warned_chamber = False %}
    {% endif %}

    {% if s.enabled %}
        {% set want_target = 1.0 if speed > 0 else 0.0 %}
        {% if (tf.target|float - want_target)|abs > 0.01 and (speed|float - s.speed|float)|abs < 0.001 %}
            {% set _ = errors.append("target was changed outside the auto loop - resetting to %d%%. Use NEVERMORE_SET SPEED=<0-1> for manual control" % (speed * 100)) %}
        {% endif %}
        {% if (speed|float - s.speed|float)|abs >= 0.001 or (tf.target|float - want_target)|abs > 0.01 %}
            {% if speed > 0 %}
                SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=nevermore TARGET=1 MIN_SPEED=0 MAX_SPEED={speed}
            {% else %}
                SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=nevermore TARGET=0
            {% endif %}
        {% endif %}
    {% endif %}

    {% for m in info %}
        RESPOND MSG="Nevermore: {m}"
    {% endfor %}
    {% for m in errors %}
        RESPOND TYPE=error MSG="Nevermore: {m}"
    {% endfor %}

    SET_GCODE_VARIABLE MACRO=_NEVERMORE_STATE VARIABLE=mode VALUE="'{mode}'"
    SET_GCODE_VARIABLE MACRO=_NEVERMORE_STATE VARIABLE=speed VALUE={speed}
    SET_GCODE_VARIABLE MACRO=_NEVERMORE_STATE VARIABLE=reached VALUE={reached}
    SET_GCODE_VARIABLE MACRO=_NEVERMORE_STATE VARIABLE=last_target VALUE={target}
    SET_GCODE_VARIABLE MACRO=_NEVERMORE_STATE VARIABLE=power_avg VALUE={power_avg}
    SET_GCODE_VARIABLE MACRO=_NEVERMORE_STATE VARIABLE=tick VALUE={tick}
    SET_GCODE_VARIABLE MACRO=_NEVERMORE_STATE VARIABLE=holdoff_until VALUE={holdoff_until}
    SET_GCODE_VARIABLE MACRO=_NEVERMORE_STATE VARIABLE=hot_session VALUE={hot}
    SET_GCODE_VARIABLE MACRO=_NEVERMORE_STATE VARIABLE=warned_sag VALUE={warned_sag}
    SET_GCODE_VARIABLE MACRO=_NEVERMORE_STATE VARIABLE=warned_chamber VALUE={warned_chamber}

[gcode_macro _NEVERMORE_DWELL]
description: Wait SECONDS while keeping the Nevermore loop running (use instead of G4 for long waits)
gcode:
    {% set seconds = params.SECONDS|default(0)|int %}
    {% for i in range((seconds / 5)|int) %}
        G4 P5000
        _NEVERMORE_TICK
    {% endfor %}
    {% if seconds % 5 > 0 %}
        G4 P{(seconds % 5) * 1000}
    {% endif %}

[gcode_macro NEVERMORE_STATUS]
description: Show what the Nevermore loop is doing
gcode:
    {% set v = printer["gcode_macro _NEVERMORE_VARS"] %}
    {% set s = printer["gcode_macro _NEVERMORE_STATE"] %}
    {% set tf = printer["temperature_fan nevermore"] %}
    {% set bed = printer.heater_bed %}
    {% set max_power = printer.configfile.settings.heater_bed.max_power|float %}
    {% set lines = [
        "Nevermore: %s, mode %s" % ("auto" if s.enabled else "MANUAL", s.mode),
        "  fan %d%% (loop set %d%%), chamber %.1fC" % (tf.speed * 100, s.speed * 100, tf.temperature),
        "  bed %.1f/%.0fC, heater %d%% of max_power (smoothed)" % (bed.temperature, bed.target, s.power_avg / max_power * 100),
        "  runs for bed targets >= %dC, scrubs until bed < %dC" % (v.bed_threshold, v.scrub_below)
    ] %}
    { action_respond_info(lines|join("\n")) }

[gcode_macro NEVERMORE_SET]
description: Run the Nevermore at a fixed speed (0-1) and turn the auto loop off
gcode:
    {% set speed = params.SPEED|default(0)|float %}
    {% if speed < 0 or speed > 1 %}
        { action_raise_error("NEVERMORE_SET: SPEED must be between 0 and 1") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_NEVERMORE_STATE VARIABLE=enabled VALUE=False
    SET_GCODE_VARIABLE MACRO=_NEVERMORE_STATE VARIABLE=speed VALUE={speed}
    {% if speed > 0 %}
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=nevermore TARGET=1 MIN_SPEED=0 MAX_SPEED={speed}
    {% else %}
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=nevermore TARGET=0
    {% endif %}
    RESPOND MSG="Nevermore: manual control at {(speed * 100)|int}% - auto loop off (NEVERMORE_AUTO ENABLE=1 to resume)"

[gcode_macro NEVERMORE_AUTO]
description: Turn the automatic Nevermore loop on or off (ENABLE=1|0)
gcode:
    {% set enable = params.ENABLE|default(1)|int != 0 %}
    {% if enable %}
        # Restart from the fan's current speed; the next tick re-evaluates the bed
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_STATE VARIABLE=speed VALUE={printer["temperature_fan nevermore"].speed|float|round(2)}
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_STATE VARIABLE=mode VALUE="'auto'"
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_STATE VARIABLE=reached VALUE=False
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_STATE VARIABLE=enabled VALUE=True
        RESPOND MSG="Nevermore: auto loop on"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_STATE VARIABLE=enabled VALUE=False
        RESPOND MSG="Nevermore: auto loop off - fan left at its current speed"
    {% endif %}

# M190 that continues once the bed is within 5C above target instead of waiting
# for the PID to settle (kept from the old bed fan macros, minus the fan logic)
[gcode_macro M190]
rename_existing: M99190
description: Set bed temperature and wait until it is within S..S+5C
gcode:
    {% set S = params.S|default(0)|float %}
    M140 S{S}
    {% if S > 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={S} MAXIMUM={S + 5}
    {% endif %}
