
[gcode_macro _PURGELINE]
gcode:
    #STATUS_PRINTING                                  # Sets SB-leds to printing-mode
    G90                                              # Absolut position
    G0 X10 Y325 Z0 F10000                      # Moves to starting point
    G91
    G1 X175 E20 F1000                                # Purge line
    G90
    G28 Z
    G0 Z10

[gcode_macro _CQGL]
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        _CG28
        QUAD_GANTRY_LEVEL
    {% endif %}
    
[gcode_macro _CG28]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
[gcode_macro PRIME]
gcode:
    #STATUS_CLEANING
    _CG28
    {% set th = printer.toolhead %}
    G0 X325 Y350 Z30 F6000
    M83
    G1 E25 F300
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament
    CLEAN_NOZZLE
    PARK
    #STATUS_READY  
    
[gcode_macro FRONT]
gcode:
    #STATUS_BUSY
    _CG28
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y5 F6000
    #STATUS_READY
    
[gcode_macro PARK]
gcode:
    #STATUS_BUSY
    _CG28
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y-25} F6000
    #STATUS_READY

[gcode_macro G32]
gcode:
    #STATUS_BUSY
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    _LED_STATE STATE=leveling
    _CG28
    _CQGL
    _CG28
    PARK
    _LED_STATE STATE=idle
    RESTORE_GCODE_STATE NAME=STATE_G32
   
[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED|default(100)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(250)|float %}
    {% set CHAMBER_TEMP = params.CHAMBER|default(0)|float %}
    {% set SOAK_MIN = params.SOAK|default(10)|float %}
    {% set PROBE_TEMP = 180 %}

    _LED_STATE STATE=heating
    RESPOND MSG="PRINT_START: heating bed to {BED_TEMP|int}C"
    M140 S{BED_TEMP}
    {% if CHAMBER_TEMP > 0 %}
        M141 S{CHAMBER_TEMP}
    {% endif %}
    G28 X Y
    M190 S{BED_TEMP}

    {% if SOAK_MIN > 0 %}
        RESPOND MSG="PRINT_START: heat soaking for {SOAK_MIN|int} min"
        G4 P{(SOAK_MIN * 60 * 1000)|int}
    {% endif %}

    RESPOND MSG="PRINT_START: heating nozzle to probe temp ({PROBE_TEMP}C)"
    M109 S{PROBE_TEMP}

    _LED_STATE STATE=leveling
    RESPOND MSG="PRINT_START: homing all axes"
    G28

    RESPOND MSG="PRINT_START: quad gantry leveling"
    QUAD_GANTRY_LEVEL

    RESPOND MSG="PRINT_START: re-homing Z after QGL"
    G28 Z

    RESPOND MSG="PRINT_START: cleaning nozzle"
    # CLEAN_NOZZLE                      # your brush/wipe macro here

    RESPOND MSG="PRINT_START: adaptive bed mesh"
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=5

    _LED_STATE STATE=heating
    RESPOND MSG="PRINT_START: heating nozzle to {EXTRUDER_TEMP|int}C"
    M109 S{EXTRUDER_TEMP}

    RESPOND MSG="PRINT_START: purging"
    # PURGE_LINE or VORON_PURGE         # your purge macro here

    G90
    G92 E0
    RESPOND MSG="PRINT_START: complete, starting print"0
    
    SKEW_PROFILE LOAD=Calilantern
    _LED_STATE STATE=printing

 
 
[gcode_macro PRINT_END]
description: Slicer end G-code. Retract, heaters off, park, motors off.
gcode:
    RESPOND MSG="PRINT_END: starting"

    SET_SKEW CLEAR=1

    # Safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set z_safe = [th.position.z + 10, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    RESPOND MSG="PRINT_END: waiting for moves to finish"
    M400                            # wait for buffer to clear

    RESPOND MSG="PRINT_END: retracting"
    G92 E0                          # zero the extruder
    G1 E-5.0 F1800                  # retract filament

    RESPOND MSG="PRINT_END: turning off heaters"
    TURN_OFF_HEATERS
    # M141 S0                       # only if your chamber heater isn't covered by TURN_OFF_HEATERS

    RESPOND MSG="PRINT_END: lifting nozzle"
    G90                             # absolute positioning
    G0 Z{z_safe} F20000             # raise nozzle to avoid stringing on the part

    RESPOND MSG="PRINT_END: parking"
    PARK
    M107                            # fan off

    RESPOND MSG="PRINT_END: clearing bed mesh"
    BED_MESH_CLEAR

    RESPOND MSG="PRINT_END: disabling motors"
    M84

    # Restore the coordinate system and speed settings changed above.
    # MOVE=0 prevents any unintended toolhead move on restore.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

    RESPOND MSG="PRINT_END: complete"
    _LED_STATE STATE=done

#####################################################################
#   Nozzle Clean and Purge Bucket
#####################################################################    
[gcode_macro CLEAN_NOZZLE]
variable_start_x: 310
variable_start_y: 343
variable_start_z: 5.3
variable_wipe_dist: -50
variable_wipe_qty: 5
variable_wipe_spd: 200
variable_raise_distance: 20

gcode:
   _CG28
   
   G90                                            ; absolute positioning
   ## Move nozzle to start position
   G1 X{start_x} Y{start_y} F6000
   G1 Z{start_z} F1500
  
   ## Wipe nozzle
   {% for wipes in range(1, (wipe_qty + 1)) %}
     G1 X{start_x + wipe_dist} F{wipe_spd * 60}
     G1 X{start_x} F{wipe_spd * 60}
   {% endfor %}
  
   ## Raise nozzle
   G1 Z{raise_distance}



#####################################################################
#   Mainsail PAUSE / RESUME / CANCEL_PRINT hooks (see mainsail.cfg)
#####################################################################
# Only the hooks are set here; every other _CLIENT_VARIABLE setting keeps its mainsail.cfg default.
[gcode_macro _CLIENT_VARIABLE]
variable_user_pause_macro : "_LED_STATE STATE=paused"
variable_user_resume_macro: "_LED_STATE STATE=printing"
variable_user_cancel_macro: "_LED_STATE STATE=error"
gcode:

[gcode_macro DUMP_VARIABLES]
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    
    {% set out = [] %}

    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    
    {action_respond_info(out|join("\n"))}

[gcode_macro PRESTART]
description: Prepare the printer for a print with preheat LED effect
gcode:
    # SET_LED LED=preheat            ; Set LEDs to preheat effect
    M140 S110                      ; Set bed temperature to 110°C
    M104 S180                      ; Set extruder temperature to 180°C
    M190 S50                      ; Wait for bed to reach 110°C
    M109 S180                      ; Wait for extruder to reach 180°C
    G28                            ; Home all axes
    M140 S110                      ; Set bed temperature to 110°C
    M104 S180                      ; Set extruder temperature to 180°C
    QUAD_GANTRY_LEVEL              ; Perform quad gantry leveling
    G28 Z                          ; Home Z-axis
    # SET_LED LED=printer_status     ; Transition LEDs to printer status effect
    PARK                           ; Execute the park macro




   